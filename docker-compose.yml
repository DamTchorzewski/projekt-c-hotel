# Środowisko lokalne projektu Hotel C: baza danych PostgreSQL. (DamianTchorzewski_72206)
# Hasło jest w pliku .env, który tworzy "npm run setup". (DamianTchorzewski_72206)

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_c_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "npm run setup" first}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_c_db}
    ports:
      # Tylko ten komputer, baza nie jest widoczna w sieci lokalnej. (DamianTchorzewski_72206)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Dane przetrwają restart kontenera. (DamianTchorzewski_72206)
      - hotel_c_data:/var/lib/postgresql/data
    healthcheck:
      # Kontener jest zdrowy dopiero wtedy, gdy baza przyjmuje połączenia. (DamianTchorzewski_72206)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_user} -d ${POSTGRES_DB:-hotel_c_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hotel_c_data:
